# =====================================================================
#  Nginx - Reverse Proxy + Rate Limiter untuk Praktikum Minggu 1
#  Lokasi di server : /etc/nginx/sites-available/praktikum
#  Aktifkan dengan  : ln -s ke /etc/nginx/sites-enabled/praktikum
#  Alur             : Client -> Nginx :80 -> Express (EJS) :3000
# =====================================================================

# ---------- Rate limiting (konteks http; file ini di-include dalam blok http) ----------
# Zona untuk halaman biasa : maksimal 10 request/detik per IP
limit_req_zone  $binary_remote_addr  zone=req_general:10m  rate=10r/s;
# Zona untuk endpoint API  : lebih ketat, 5 request/detik per IP
limit_req_zone  $binary_remote_addr  zone=req_api:10m      rate=5r/s;
# Batas koneksi bersamaan per IP
limit_conn_zone $binary_remote_addr  zone=conn_per_ip:10m;

# Kode status saat kena limit: 429 Too Many Requests (default Nginx adalah 503)
limit_req_status  429;
limit_conn_status 429;
limit_req_log_level warn;

# ---------- Backend: aplikasi Express ----------
upstream express_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Sembunyikan versi Nginx
    server_tokens off;

    access_log /var/log/nginx/praktikum_access.log;
    error_log  /var/log/nginx/praktikum_error.log warn;

    # ---------- Batas ukuran & timeout (anti slowloris / body besar) ----------
    client_max_body_size    1m;
    client_body_timeout     10s;
    client_header_timeout   10s;
    send_timeout            15s;
    keepalive_timeout       30s;

    # Maksimal 20 koneksi bersamaan per IP
    limit_conn conn_per_ip 20;

    # ---------- Security headers ----------
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "SAMEORIGIN" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

    # ---------- Kompresi ----------
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;

    # ---------- Pengaturan proxy (diwarisi oleh semua location) ----------
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    # ---------- Blokir file tersembunyi (.env, .git, dll) ----------
    location ~ /\.(?!well-known) {
        return 404;
    }

    # ---------- Endpoint API: rate limit lebih ketat ----------
    location /api/ {
        limit_req zone=req_api burst=10 nodelay;
        proxy_pass http://express_app;
    }

    # ---------- Semua halaman lain ----------
    location / {
        limit_req zone=req_general burst=20 nodelay;
        proxy_pass http://express_app;
    }

    # ---------- Halaman error kustom ----------
    error_page 429 @too_many_requests;
    location @too_many_requests {
        default_type application/json;
        return 429 '{"error":"Terlalu banyak request. Coba lagi sebentar."}';
    }

    error_page 502 503 504 @backend_down;
    location @backend_down {
        default_type text/plain;
        return 502 'Aplikasi sedang tidak tersedia. Cek status dengan: pm2 status';
    }
}
