# =====================================================================
#  Nginx di dalam container: reverse proxy + rate limiter
#  Di-mount ke /etc/nginx/conf.d/default.conf (konteks http)
#  Alur: Client -> nginx :80 -> app:3000 (nama service Docker)
# =====================================================================

limit_req_zone  $binary_remote_addr  zone=req_general:10m  rate=10r/s;
limit_req_zone  $binary_remote_addr  zone=req_api:10m      rate=5r/s;
limit_conn_zone $binary_remote_addr  zone=conn_per_ip:10m;
limit_req_status  429;
limit_conn_status 429;

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    client_max_body_size  1m;
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          15s;
    limit_conn conn_per_ip 20;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;

    # DNS internal Docker. Dengan variabel di proxy_pass, Nginx me-resolve ulang nama "app"
    # tiap beberapa detik, sehingga tetap jalan saat container app dibuat ulang (IP berubah).
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend "http://app:3000";

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    location ~ /\.(?!well-known) {
        return 404;
    }

    location /api/ {
        limit_req zone=req_api burst=10 nodelay;
        proxy_pass $backend;
    }

    location / {
        limit_req zone=req_general burst=20 nodelay;
        proxy_pass $backend;
    }

    error_page 429 @too_many_requests;
    location @too_many_requests {
        default_type application/json;
        return 429 '{"error":"Terlalu banyak request. Coba lagi sebentar."}';
    }

    error_page 502 503 504 @backend_down;
    location @backend_down {
        default_type text/plain;
        return 502 'Aplikasi sedang tidak tersedia. Cek status dengan: docker compose ps';
    }
}
