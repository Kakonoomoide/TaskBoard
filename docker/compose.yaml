# =====================================================================
#  Docker Compose - Task Board (db + app + nginx)
#  Jalankan dari folder ini:  docker compose up -d --build
#
#  Alur:  Browser -> nginx :80 -> app :3000 -> db :5432
#  Hanya nginx yang membuka port ke host. app & db hanya di jaringan internal.
# =====================================================================
name: praktikum

services:
  # ---------- Database ----------
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-praktikum_db}
      POSTGRES_USER: ${DB_USER:-praktikum_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di docker/.env}
    volumes:
      # Data disimpan di named volume agar tidak hilang saat container dihapus
      - db_data:/var/lib/postgresql/data
      # File .sql di folder ini dijalankan otomatis SEKALI saat volume masih kosong
      - ../database/02_schema.sql:/docker-entrypoint-initdb.d/02_schema.sql:ro
      - ../database/03_seed.sql:/docker-entrypoint-initdb.d/03_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [backend]

  # ---------- Aplikasi Express + EJS ----------
  app:
    build:
      context: ../apps
    image: praktikum-app:latest
    restart: unless-stopped
    init: true
    environment:
      APP_NAME: ${APP_NAME:-Praktikum Minggu 3 (Docker)}
      NODE_ENV: production
      HOST: 0.0.0.0          # di dalam container harus 0.0.0.0 agar nginx bisa menjangkau
      PORT: 3000
      DB_HOST: db            # nama service = nama host (DNS internal Docker)
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-praktikum_db}
      DB_USER: ${DB_USER:-praktikum_user}
      DB_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di docker/.env}
    depends_on:
      db:
        condition: service_healthy     # tunggu db benar-benar siap
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [backend, frontend]

  # ---------- Nginx: reverse proxy + rate limiter ----------
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/praktikum.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [frontend]

networks:
  frontend:   # nginx <-> app
  backend:    # app <-> db (db tidak terjangkau dari nginx maupun internet)

volumes:
  db_data:
